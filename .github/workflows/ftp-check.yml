# Временный сценарий: убирает копию сайта, которая при первой выгрузке попала
# в папку www/sait.ezegames.ru внутри другого сайта. Удаляются только файлы из этого
# репозитория и пустые папки. Сценарий будет удалён следующим коммитом.
name: Уборка после первой выгрузки
on:
  push:
    branches: [arena/8b228cab-sait]
    paths: ['.github/workflows/ftp-check.yml']
concurrency:
  group: deploy-hosting
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  clean:
    name: Уборка
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Удаление лишней копии
        run: |
          set +e
          base="www/sait.ezegames.ru"
          opts=(--silent --show-error --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD")
          args=()
          while IFS= read -r f; do args+=(-Q "*DELE $base/$f"); done < <(git ls-files | grep -v -E '^(\.github/|\.gitignore$|README\.md$)')
          args+=(-Q "*DELE $base/.ftp-deploy-sync-state.json")
          for d in assets/img assets/fonts assets css js; do args+=(-Q "*RMD $base/$d"); done
          args+=(-Q "*RMD $base" -Q "*RMD www")
          curl "${opts[@]}" "${args[@]}" --list-only -o /dev/null "ftp://$FTP_SERVER/"
          echo "curl exit: $?"
          root="$(curl "${opts[@]}" --list-only "ftp://$FTP_SERVER/" | tr -d '\r')"
          if echo "$root" | grep -qx "www"; then
            left="$(curl "${opts[@]}" "ftp://$FTP_SERVER/www/" | tr -d '\r' | awk '{print substr($1,1,1), $NF}' | tr '\n' ';')"
            sub="$(curl "${opts[@]}" "ftp://$FTP_SERVER/$base/" 2>&1 | tr -d '\r' | awk '{print substr($1,1,1), $NF}' | tr '\n' ';')"
            echo "::notice title=FTP-clean::Папка www осталась. www: $left | внутри: $sub"
          else
            echo "::notice title=FTP-clean::Лишняя копия удалена, папки www в корне больше нет. Записей в корне: $(echo "$root" | grep -c .)"
          fi
