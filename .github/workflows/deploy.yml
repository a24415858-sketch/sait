# Автоматическая выгрузка сайта на хостинг по FTP после каждого пуша.
#
# Доступы к хостингу хранятся НЕ в репозитории, а в зашифрованных секретах GitHub:
# Settings → Secrets and variables → Actions → New repository secret
#   FTP_SERVER    — адрес FTP-сервера (из панели хостинга)
#   FTP_USERNAME  — логин FTP
#   FTP_PASSWORD  — пароль FTP
#   FTP_DIR       — (необязательно) папка сайта относительно корня FTP-аккаунта,
#                   со слэшем на конце. Если аккаунт открывается сразу в папке сайта —  ./
#                   Если папка не подходит, сценарий сам пробует корень аккаунта.
#   FTP_PROTOCOL  — (необязательно) ftp или ftps, по умолчанию ftp
#
# Перед выгрузкой сценарий проверяет, что папка FTP_DIR действительно открывается
# по адресу SITE_URL. Если нет — выгрузка останавливается, чтобы не записать файлы
# в папку другого сайта.
name: Выгрузка на хостинг

on:
  push:
    branches:
      - main
      - arena/8b228cab-sait
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: http://sait.ezegames.ru

jobs:
  deploy:
    name: FTP
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
    steps:
      - name: Проверка секретов
        id: check
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Выгрузка пропущена: не заданы секреты FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (Settings → Secrets and variables → Actions)."
          fi

      - name: Проверка, что папка на сервере — это папка сайта
        id: guard
        if: steps.check.outputs.ready == 'true'
        run: |
          set -uo pipefail
          # Папка из секрета FTP_DIR, а если она не подходит — корень FTP-аккаунта.
          # Подходит только та папка, файл из которой открывается по адресу сайта.
          want="$(printf '%s' "${FTP_DIR:-./}" | tr -d '[:space:]')"; want="${want#./}"; want="${want#/}"
          if [ -n "$want" ]; then want="${want%/}/"; fi
          probe="deploy-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          token="mir-mebeli-$(openssl rand -hex 8)"
          printf '%s' "$token" > "$RUNNER_TEMP/$probe"
          opts=(--silent --show-error --connect-timeout 20 --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD")
          if [ "${FTP_PROTOCOL:-ftp}" = "ftps" ]; then opts+=(--ssl-reqd); fi

          if ! list="$(curl "${opts[@]}" --list-only "ftp://$FTP_SERVER/" 2>&1)"; then
            list="$(printf '%s' "$list" | tr '\r\n' '  ' | cut -c1-300)"
            echo "::error::Вход по FTP не выполнен: проверьте FTP_SERVER, FTP_USERNAME и FTP_PASSWORD. Ответ сервера: $list"
            exit 1
          fi

          found=""; report=""
          for dir in "$want" ""; do
            if [ -n "$report" ] && [ "$dir" = "$want" ]; then continue; fi
            name="${dir:-./}"
            if ! err="$(curl "${opts[@]}" -T "$RUNNER_TEMP/$probe" "ftp://$FTP_SERVER/$dir$probe" 2>&1)"; then
              err="$(printf '%s' "$err" | tr '\r\n' '  ' | cut -c1-200)"
              report="$report Папка «$name»: записать файл не удалось ($err)."
              continue
            fi
            sleep 3
            got="$(curl -sS -L -k --max-time 30 "$SITE_URL/$probe?t=$RANDOM" || true)"
            curl "${opts[@]}" -Q "*DELE $dir$probe" --list-only -o /dev/null "ftp://$FTP_SERVER/" || true
            if [ "$got" = "$token" ]; then found="$name"; break; fi
            report="$report Папка «$name»: файл записан, но по адресу сайта не открылся — это папка другого сайта."
          done

          if [ -z "$found" ]; then
            echo "::error::Папка сайта $SITE_URL на FTP не найдена, выгрузка остановлена.$report"
            exit 1
          fi
          if [ "$found" != "${want:-./}" ]; then
            echo "::warning::Папка из секрета FTP_DIR не подошла, сайт выгружается в «$found». Чтобы убрать предупреждение, задайте FTP_DIR = $found"
          fi
          echo "dir=$found" >> "$GITHUB_OUTPUT"
          echo "Папка на сервере соответствует $SITE_URL: $found"

      - name: Получение файлов сайта
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Выгрузка по FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ steps.guard.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            README.md

      - name: Проверка сайта после выгрузки
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 3
          if curl -sS -L -k --max-time 30 "$SITE_URL/?t=$RANDOM" | grep -q "Мир Мебели"; then
            echo "Сайт обновлён: $SITE_URL"
          else
            echo "::error::Файлы выгружены, но по адресу $SITE_URL сайт «Мир Мебели» не открывается."
            exit 1
          fi
